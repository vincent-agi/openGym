name: CI

# Required status checks on `main`: "Frontend (test + build)" and "API (syntax + boot smoke)".
# The "Scripts" job is informational for now (not a required check).
# No `paths:` filter on purpose: a required check that is skipped by a path filter stays
# "pending" forever and blocks the merge. Both jobs are fast and cached, so run them always.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22" # matches api/Dockerfile and web/Dockerfile

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  api:
    name: API (syntax + boot smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: node --check server.js
      - name: Unit & route tests
        run: npm test
      - name: Boot smoke
        # Complements the route tests: proves `node server.js` itself starts and answers HTTP.
        run: |
          DATA_DIR="$(mktemp -d)" PORT=3999 node server.js &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/ || true)
            if [ "$code" != "000" ]; then echo "API answered HTTP $code"; exit 0; fi
            sleep 0.5
          done
          echo "API did not start" >&2
          exit 1

  scripts:
    # Not a required check (yet): promote it in branch protection once it has been stable for a while.
    name: Scripts (shellcheck + tests) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest] # macOS ships bash 3.2: the scripts must run there
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and jq if missing
        run: |
          for t in shellcheck jq; do
            command -v "$t" >/dev/null 2>&1 && continue
            if [ "$RUNNER_OS" = macOS ]; then brew install "$t"; else sudo apt-get install -y "$t"; fi
          done
      - name: shellcheck
        run: shellcheck -S warning scripts/gymme scripts/TEMPLATE.sh scripts/fetch-media.sh scripts/*/*.sh scripts/tests/mocks/*
      - name: Unit tests (system bash)
        run: /bin/bash scripts/tests/run.sh
      - name: Command index (every command has a description, no duplicates)
        run: scripts/gymme help --check

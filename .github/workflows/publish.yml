name: Publish images

# Trigger choice: every merge to `main` publishes `:latest` + `:sha-<short>`; releases
# (release.yml) call this workflow with a `version` so the same build also gets `:X.Y.Z` / `:X.Y`.
# Why workflow_call and not "on tag push": tags/releases created with GITHUB_TOKEN do not
# trigger other workflows, so release.yml has to invoke this one explicitly.
#
# Rollback = change the image tag in docker-compose.yml (e.g. :sha-1a2b3c4 or :1.5.0), no rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Semver without leading v (e.g. 1.6.0). Adds :X.Y.Z and :X.Y tags."
        type: string
        required: false
        default: ""

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-pushed release

permissions:
  contents: read
  packages: write # push to ghcr.io with the built-in GITHUB_TOKEN, no personal credentials

jobs:
  publish:
    name: Build, scan & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
            dockerfile: ./api/Dockerfile
          - name: web
            context: .
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr.io requires lowercase)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/opengym-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Add major.minor tag
        id: minor
        if: ${{ inputs.version != '' }}
        run: echo "tag=$(echo '${{ inputs.version }}' | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      # 1) Build one local image and scan it. Nothing is pushed if this fails.
      - name: Build (amd64, local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: scan/${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Trivy scan (HIGH/CRITICAL blocks the push)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan/${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only block on what a rebuild/bump can actually fix
          exit-code: "1"
          format: table

      # 2) Scan passed: build multi-arch (cache hit) and push.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.minor.outputs.tag != '' && format('{0}:{1}', env.IMAGE, steps.minor.outputs.tag) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

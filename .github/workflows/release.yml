name: Release

# On every merge to `main`, release-please reads the Conventional Commits since the last tag:
#   feat -> minor, fix -> patch, `type!:` / BREAKING CHANGE -> major.
# It keeps a "release PR" open (version bump in frontend/ + api/ package.json and CHANGELOG.md).
# Merging that PR creates the git tag + GitHub Release, then the images are published with
# matching tags. Pure chore/docs/ci/test commits never produce a release.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write # needed by the called publish workflow

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PRs opened with the default GITHUB_TOKEN do not trigger CI, so the release PR would
          # sit without required checks. Set a fine-grained PAT (or GitHub App token) as the
          # RELEASE_PLEASE_TOKEN repo secret; falls back to GITHUB_TOKEN until then.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Tags created with GITHUB_TOKEN don't fire other workflows, so call publish explicitly.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: read
      packages: write
